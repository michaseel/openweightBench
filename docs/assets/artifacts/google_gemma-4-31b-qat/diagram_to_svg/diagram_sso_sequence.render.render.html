<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#fff;font-family:system-ui,-apple-system,sans-serif}
  .wrap{padding:24px;display:inline-block;background:#fff}
  /* Force a concrete render box: many model-emitted SVGs only set viewBox.
     Without a width here, an inline-block parent collapses the SVG to its
     intrinsic ~300x150 (or smaller) and the screenshot becomes a tiny
     blank tile. Fixed width + auto height uses viewBox aspect-ratio. */
  .wrap svg{display:block;width:1200px;height:auto;max-width:none}
</style></head><body><div class="wrap"><svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#fff" />

  <!-- Title -->
  <text x="500" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold">SSO - Ablaufdiagramm</text>

  <!-- Entities -->
  <g id="entities">
    <!-- Benutzer (Stick Figure) -->
    <g id="user" transform="translate(150, 250)">
      <circle cx="0" cy="0" r="20" stroke="#000" stroke-width="2" fill="none" />
      <line x1="0" y1="20" x2="0" y2="60" stroke="#000" stroke-width="2" />
      <line x1="-20" y1="40" x2="20" y2="40" stroke="#000" stroke-width="2" />
      <line x1="0" y1="60" x2="-15" y2="90" stroke="#000" stroke-width="2" />
      <line x1="0" y1="60" x2="15" y2="90" stroke="#000" stroke-width="2" />
      <text x="0" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Benutzer</text>
    </g>

    <!-- App / Service Provider -->
    <g id="app_sp">
      <rect x="300" y="200" width="180" height="100" stroke="#000" stroke-width="2" fill="none" />
      <text x="390" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">App /</text>
      <text x="390" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Service Provider</text>
    </g>

    <!-- Identity Provider -->
    <g id="idp">
      <rect x="600" y="200" width="180" height="100" stroke="#000" stroke-width="2" fill="none" />
      <text x="690" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Identity Provider</text>
      <text x="690" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">(IdP)</text>
    </g>

    <!-- Login Seite -->
    <g id="login_page">
      <rect x="600" y="380" width="180" height="80" stroke="#000" stroke-width="2" fill="none" />
      <text x="690" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Login-Seite</text>
    </g>

    <!-- Decision Diamond -->
    <g id="decision">
      <path d="M 690 520 L 780 570 L 690 620 L 600 570 Z" stroke="#000" stroke-width="2" fill="none" />
      <text x="690" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Anmeldedaten</text>
      <text x="690" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">korrekt?</text>
    </g>

    <!-- Zugriff Gewährt -->
    <g id="access_granted">
      <rect x="300" y="680" width="180" height="80" stroke="#000" stroke-width="2" fill="none" />
      <text x="390" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Zugriff</text>
      <text x="390" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">gewährt</text>
    </g>
  </g>

  <!-- Connections -->
  <g id="connections">
    <!-- 1. Zugang zu App -->
    <line x1="170" y1="260" x2="300" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="235" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">1. Zugang zu App</text>

    <!-- 2. Weiterleitung zur Login-Seite -->
    <line x1="480" y1="220" x2="600" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="540" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">2. Weiterleitung</text>
    <text x="540" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">zur Login-Seite</text>

    <!-- 3. Login-Seite anzeigen -->
    <line x1="690" y1="300" x2="690" y2="380" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="700" y="340" text-anchor="start" font-family="Arial, sans-serif" font-size="14">3. Login-Seite anzeigen</text>

    <!-- Benutzer gibt Anmeldedaten ein -->
    <line x1="850" y1="420" x2="780" y2="420" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="860" y="410" text-anchor="start" font-family="Arial, sans-serif" font-size="14">Benutzer gibt</text>
    <text x="860" y="425" text-anchor="start" font-family="Arial, sans-serif" font-size="14">Anmeldedaten ein</text>

    <!-- 4. Authentifizierung -->
    <line x1="690" y1="460" x2="690" y2="520" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="700" y="490" text-anchor="start" font-family="Arial, sans-serif" font-size="14">4. Authentifizierung</text>

    <!-- Nein Path -->
    <path d="M 780 570 L 820 570 L 820 420 L 780 420" stroke="#000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
    <text x="790" y="560" text-anchor="start" font-family="Arial, sans-serif" font-size="14">Nein</text>

    <!-- Ja Path -->
    <line x1="690" y1="620" x2="690" y2="650" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="695" y="635" text-anchor="start" font-family="Arial, sans-serif" font-size="14">Ja</text>
    
    <!-- 5. Token / Assertion -->
    <path d="M 690 650 L 690 700 L 390 700 L 390 300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="695" y="670" text-anchor="start" font-family="Arial, sans-serif" font-size="14">5. Token / Assertion</text>
    <text x="695" y="685" text-anchor="start" font-family="Arial, sans-serif" font-size="14">(SSO-Response)</text>
    <text x="400" y="690" text-anchor="start" font-family="Arial, sans-serif" font-size="14">6. Redirect zurück zur App mit Token</text>

    <!-- 7. Zugriff auf Ressourcen -->
    <line x1="390" y1="300" x2="390" y2="680" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="250" y="640" text-anchor="start" font-family="Arial, sans-serif" font-size="14">7. Zugriff auf Ressourcen</text>
  </g>
</svg></div></body></html>
