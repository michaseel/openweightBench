<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#fff;font-family:system-ui,-apple-system,sans-serif}
  .wrap{padding:24px;display:inline-block;background:#fff}
  /* Force a concrete render box: many model-emitted SVGs only set viewBox.
     Without a width here, an inline-block parent collapses the SVG to its
     intrinsic ~300x150 (or smaller) and the screenshot becomes a tiny
     blank tile. Fixed width + auto height uses viewBox aspect-ratio. */
  .wrap svg{display:block;width:1200px;height:auto;max-width:none}
</style></head><body><div class="wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0 0 L0 6 L9 3 z" fill="black"/>
</marker>
</defs>
<g id="title">
<text x="500" y="80" font-family="sans-serif" font-size="28" text-anchor="middle">SSO - Ablaufdiagramm</text>
<line x1="200" y1="95" x2="800" y2="95" stroke="black" stroke-width="2"/>
</g>
<g id="user">
<circle cx="150" cy="200" r="18" fill="none" stroke="black" stroke-width="2"/>
<line x1="150" y1="218" x2="150" y2="260" stroke="black" stroke-width="2"/>
<line x1="130" y1="250" x2="170" y2="250" stroke="black" stroke-width="2"/>
<line x1="150" y1="260" x2="130" y2="290" stroke="black" stroke-width="2"/>
<line x1="150" y1="260" x2="170" y2="290" stroke="black" stroke-width="2"/>
<text x="150" y="310" font-family="sans-serif" font-size="18" text-anchor="middle">Benutzer</text>
</g>
<g id="app">
<rect x="300" y="180" width="150" height="110" fill="none" stroke="black" stroke-width="2"/>
<text x="375" y="220" font-family="sans-serif" font-size="20" text-anchor="middle">App /</text>
<text x="375" y="250" font-family="sans-serif" font-size="20" text-anchor="middle">Service Provider</text>
</g>
<g id="idp">
<rect x="620" y="180" width="180" height="110" fill="none" stroke="black" stroke-width="2"/>
<text x="710" y="220" font-family="sans-serif" font-size="20" text-anchor="middle">Identity Provider</text>
<text x="710" y="250" font-family="sans-serif" font-size="20" text-anchor="middle">(IdP)</text>
</g>
<g id="login">
<rect x="620" y="350" width="180" height="80" fill="none" stroke="black" stroke-width="2"/>
<text x="710" y="390" font-family="sans-serif" font-size="22" text-anchor="middle">Login-Seite</text>
</g>
<g id="diamond">
<polygon points="700,500 800,550 700,600 600,550" fill="none" stroke="black" stroke-width="2"/>
<text x="700" y="545" font-family="sans-serif" font-size="16" text-anchor="middle">Anmeldedaten</text>
<text x="700" y="570" font-family="sans-serif" font-size="16" text-anchor="middle">korrekt?</text>
</g>
<g id="access">
<rect x="260" y="620" width="150" height="80" fill="none" stroke="black" stroke-width="2"/>
<text x="335" y="650" font-family="sans-serif" font-size="20" text-anchor="middle">Zugriff</text>
<text x="335" y="680" font-family="sans-serif" font-size="20" text-anchor="middle">gewährt</text>
</g>
<g id="arrows">
<line x1="200" y1="230" x2="300" y2="235" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="215" font-family="sans-serif" font-size="14" fill="#0000aa" text-anchor="middle">1. Zugang zu App</text>
<line x1="450" y1="235" x2="620" y2="235" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="535" y="210" font-family="sans-serif" font-size="14" fill="#0000aa" text-anchor="middle">2. Weiterleitung</text>
<text x="535" y="230" font-family="sans-serif" font-size="14" fill="#0000aa" text-anchor="middle">zur Login-Seite</text>
<line x1="710" y1="290" x2="710" y2="350" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="770" y="320" font-family="sans-serif" font-size="14" fill="#0000aa">3. Login-Seite</text>
<text x="770" y="340" font-family="sans-serif" font-size="14" fill="#0000aa">anzeigen</text>
<line x1="710" y1="430" x2="700" y2="500" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="720" y="470" font-family="sans-serif" font-size="14" fill="#0000aa">4. Authentifizierung</text>
<line x1="700" y1="600" x2="700" y2="680" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="730" y="650" font-family="sans-serif" font-size="14" fill="#0000aa">5. Token / Assertion</text>
<text x="730" y="670" font-family="sans-serif" font-size="14" fill="#0000aa">(SSO-Response)</text>
<polyline points="600,550 375,580 375,290" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400" y="400" font-family="sans-serif" font-size="14" fill="#0000aa">6. Redirect zurück</text>
<text x="400" y="420" font-family="sans-serif" font-size="14" fill="#0000aa">zur App mit Token</text>
<line x1="335" y1="620" x2="335" y2="290" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="600" font-family="sans-serif" font-size="14" fill="#0000aa">7. Zugriff</text>
<text x="250" y="620" font-family="sans-serif" font-size="14" fill="#0000aa">auf Ressourcen</text>
<polyline points="800,400 850,400 850,550" fill="none" stroke="black" stroke-width="2" stroke-dasharray="5,5"/>
<text x="830" y="360" font-family="sans-serif" font-size="14" fill="#0000aa">Benutzer gibt</text>
<text x="830" y="380" font-family="sans-serif" font-size="14" fill="#0000aa">Anmeldedaten ein</text>
<polyline points="800,400 800,430 850,430" fill="none" stroke="black" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
<text x="770" y="560" font-family="sans-serif" font-size="14" fill="#0000aa">Nein</text>
<text x="750" y="640" font-family="sans-serif" font-size="14" fill="#0000aa">Ja</text>
</g>
</svg></div></body></html>
